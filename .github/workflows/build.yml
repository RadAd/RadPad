# Builds Release x64 and ARM64 on every push and pull request, and keeps what the build puts in dist
# (the zip, the installer and the MSIX for the Store) as artifacts of the run. Pushing a version tag
# (v1.2.3, matching RadPad/Version.h) also publishes a GitHub release with the zips and installers.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore RadPad.sln

      # The build makes an installer only if Inno Setup is installed.
      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      # MSBuild's errors are repeated as annotations, so they show on the run's summary page.
      - name: Build
        run: |
          msbuild RadPad.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /m /v:minimal | Tee-Object -Variable log
          if ($LASTEXITCODE) {
            $log | Select-String -Pattern '\berror\b' | ForEach-Object { "::error::$($_.Line.Trim())" }
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: RadPad-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # The MSIX isn't attached: it's unsigned, so it's only for uploading to the Store.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Version.h
        run: |
          version=$(sed -nE 's/^#define RADPAD_VERSION_(MAJOR|MINOR|PATCH) +([0-9]+).*/\2/p' RadPad/Version.h | paste -sd.)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match RadPad/Version.h ($version)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "RadPad ${GITHUB_REF_NAME#v}" --generate-notes artifacts/*/*.zip artifacts/*/*-setup.exe
